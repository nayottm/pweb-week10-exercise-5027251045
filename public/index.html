<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventaris Alat Sinematografi</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Inventaris Alat Sinematografi</h1>
    <form id="form-alat">
      <label for="nama-alat">Nama alat</label>
      <input id="nama-alat" name="nama" placeholder="Contoh: Kamera Cinema" required>
      <div class="aksi-form">
        <button type="submit">Tambah alat</button>
        <button type="button" id="tombol-batal" class="sekunder" hidden>Batal</button>
      </div>
    </form>
    <p id="pesan" role="status"></p>
    <table>
      <thead><tr><th>ID</th><th>Nama alat sinematografi</th><th>Aksi</th></tr></thead>
      <tbody id="daftar-alat"></tbody>
    </table>
  </main>
</body>
</html>
